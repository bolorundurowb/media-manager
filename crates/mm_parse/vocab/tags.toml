# Tag vocabularies for the filename parser (§3.5).
#
# Compiled into the binary via `include_str!` and used to build the extractor
# regex sets at first use. Overridable from user config (not yet wired — the
# override path is a config-loader concern, tracked for Phase 2).
#
# Each `[[entry]]` maps one or more surface patterns (matched case-insensitively,
# with `_`/`.`/`+` already normalised to spaces before matching, and `\b`-style
# word boundaries assumed around each pattern) to one canonical output value.

# ---------------------------------------------------------------------------
# Resolution (§3.2, §4 resolution labelling vocabulary — the *filename* signal,
# independent of the container-derived banding in mm-probe).
# ---------------------------------------------------------------------------
[[resolution]]
canonical = "480p"
patterns = ["480p", "640x480", "848x480"]

[[resolution]]
canonical = "576p"
patterns = ["576p", "720x576"]

[[resolution]]
canonical = "720p"
patterns = ["720p", "1280x720", "hd"]

[[resolution]]
canonical = "1080p"
patterns = ["1080p", "1080i", "1920x1080", "fhd", "full hd"]

[[resolution]]
canonical = "1440p"
patterns = ["1440p", "2560x1440", "qhd"]

[[resolution]]
canonical = "2160p"
patterns = ["2160p", "3840x2160", "4k", "uhd"]

[[resolution]]
canonical = "4320p"
patterns = ["4320p", "7680x4320", "8k"]

# ---------------------------------------------------------------------------
# Source (rip/capture origin).
# ---------------------------------------------------------------------------
[[source]]
canonical = "BluRay"
patterns = ["bluray", "blu ray", "bdrip", "brrip", "bd25", "bd50", "bdremux"]

[[source]]
canonical = "WEB-DL"
patterns = ["web dl", "webdl", "web-dl"]

[[source]]
canonical = "WEBRip"
patterns = ["webrip", "web rip"]

[[source]]
canonical = "WEB"
patterns = ["web"]

[[source]]
canonical = "HDTV"
patterns = ["hdtv"]

[[source]]
canonical = "PDTV"
patterns = ["pdtv"]

[[source]]
canonical = "DVDRip"
patterns = ["dvdrip", "dvd rip"]

[[source]]
canonical = "DVD"
patterns = ["dvd", "dvd5", "dvd9"]

[[source]]
canonical = "CAM"
patterns = ["cam", "hdcam"]

[[source]]
canonical = "TS"
patterns = ["telesync", "hdts"]

[[source]]
canonical = "TC"
patterns = ["telecine", "hdtc"]

[[source]]
canonical = "SCR"
patterns = ["screener", "dvdscr", "scr"]

# ---------------------------------------------------------------------------
# Video codec.
# ---------------------------------------------------------------------------
[[video_codec]]
canonical = "x264"
patterns = ["x264", "h264", "h 264", "avc"]

[[video_codec]]
canonical = "x265"
patterns = ["x265", "h265", "h 265", "hevc"]

[[video_codec]]
canonical = "XviD"
patterns = ["xvid"]

[[video_codec]]
canonical = "DivX"
patterns = ["divx"]

[[video_codec]]
canonical = "AV1"
patterns = ["av1"]

[[video_codec]]
canonical = "VP9"
patterns = ["vp9"]

# ---------------------------------------------------------------------------
# Audio format.
# ---------------------------------------------------------------------------
[[audio_format]]
canonical = "Atmos"
patterns = ["atmos", "dolby atmos"]

[[audio_format]]
canonical = "TrueHD"
patterns = ["truehd", "true hd"]

[[audio_format]]
canonical = "DTS-HD"
patterns = ["dts hd", "dtshd", "dts hd ma", "dts x", "dtsx"]

[[audio_format]]
canonical = "DTS"
patterns = ["dts"]

[[audio_format]]
canonical = "DD5.1"
patterns = ["dd5 1", "ac3 5 1", "dolby digital 5 1"]

[[audio_format]]
canonical = "DDP5.1"
patterns = ["ddp5 1", "eac3 5 1", "dd+5 1", "ddp"]

[[audio_format]]
canonical = "AC3"
patterns = ["ac3", "dolby digital"]

[[audio_format]]
canonical = "EAC3"
patterns = ["eac3", "e ac3"]

[[audio_format]]
canonical = "AAC"
patterns = ["aac", "aac2 0"]

[[audio_format]]
canonical = "FLAC"
patterns = ["flac"]

[[audio_format]]
canonical = "MP3"
patterns = ["mp3"]

[[audio_format]]
canonical = "Opus"
patterns = ["opus"]

# ---------------------------------------------------------------------------
# HDR format — filename-only signal (§4: no pure-Rust container HDR probing).
# ---------------------------------------------------------------------------
[[hdr]]
canonical = "DV"
patterns = ["dolby vision", "dovi", "dv"]

[[hdr]]
canonical = "HDR10+"
patterns = ["hdr10plus", "hdr10 plus", "hdr10+"]

[[hdr]]
canonical = "HDR10"
patterns = ["hdr10"]

[[hdr]]
canonical = "HDR"
patterns = ["hdr"]

# ---------------------------------------------------------------------------
# Edition — matched as vocabulary (not left to positional-residual guessing),
# so a movie's leading residual after all vocabulary extractors run is title.
# ---------------------------------------------------------------------------
[[edition]]
canonical = "Director's Cut"
patterns = ["directors cut", "director s cut", "director's cut"]

[[edition]]
canonical = "Extended Edition"
patterns = ["extended edition", "extended cut", "extended"]

[[edition]]
canonical = "Theatrical Cut"
patterns = ["theatrical cut", "theatrical"]

[[edition]]
canonical = "Unrated"
patterns = ["unrated"]

[[edition]]
canonical = "Uncut"
patterns = ["uncut"]

[[edition]]
canonical = "Ultimate Edition"
patterns = ["ultimate edition"]

[[edition]]
canonical = "Final Cut"
patterns = ["final cut"]

[[edition]]
canonical = "Redux"
patterns = ["redux"]

[[edition]]
canonical = "Special Edition"
patterns = ["special edition"]

[[edition]]
canonical = "Criterion Collection"
patterns = ["criterion collection", "criterion"]

[[edition]]
canonical = "Remastered"
patterns = ["remastered", "remaster"]

[[edition]]
canonical = "IMAX Edition"
patterns = ["imax edition", "imax"]

# ---------------------------------------------------------------------------
# Language (ISO 639-1 target; §5.4 wants full 639-2/B/T + endonym coverage —
# this is the subset needed for filename tokens; the full compiled-in table
# lives in mm-engine's association stage, Phase 2/5).
# ---------------------------------------------------------------------------
[[language]]
canonical = "en"
patterns = ["english", "eng"]

[[language]]
canonical = "fr"
patterns = ["french", "fre", "fra", "vff", "vf"]

[[language]]
canonical = "es"
patterns = ["spanish", "spa", "esp"]

[[language]]
canonical = "de"
patterns = ["german", "ger", "deu"]

[[language]]
canonical = "it"
patterns = ["italian", "ita"]

[[language]]
canonical = "ja"
patterns = ["japanese", "jpn"]

[[language]]
canonical = "multi"
patterns = ["multi", "dual audio", "dual"]
