# Starter parser corpus for TV episodes (§11, §22.3, §3.2).
# Modelled on testdata/names/movies.toml. >= 20 representative cases covering
# single episode, multi-episode (all §3.2 forms), absolute-style NxNN,
# specials, year-disambiguated shows, episode title present/absent, release
# group, and resolution/source/codec tags.

[[case]]
name = "Show.Name.S01E02.1080p.WEB.x264-GROUP.mkv"
title = "Show Name"
season = 1
episodes = [2]
resolution = "1080p"
video_codec = "x264"
release_group = "GROUP"

