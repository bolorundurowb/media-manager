[package]
name = "media-manager"
version = "0.3.0"
edition = "2021"
description = "In-place Jellyfin movie and TV library normalizer"
license = "MIT"

[[bin]]
name = "media-manager"
path = "src/main.rs"

[[bin]]
name = "media-manager-gui"
path = "src/bin/media-manager-gui.rs"
required-features = ["gui"]

[features]
# Kept out of the default build so `cargo build` / `cargo test` stay a thin
# CLI and never pull in eframe/egui/rfd (and their windowing/graphics deps).
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
regex = "1.13.1"
tracing = "0.1.44"
unicode-normalization = "0.1.25"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# GUI (Phase 7), behind the `gui` feature.
eframe = { version = "0.36.1", optional = true }
egui = { version = "0.36.1", optional = true }
rfd = { version = "0.17.2", optional = true }
rayon = "1.12.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
