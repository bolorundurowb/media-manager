# Clippy configuration for the media-manager workspace.
# §4 of PLAN.md: probers must never write tags. `lofty`'s write API is
# mechanically banned so the "embedded metadata must not be modified" guarantee
# (spec §2.5 / §8.4) is enforced by the toolchain, not by convention.
disallowed-methods = [
    { path = "lofty::tag::file::TaggedFileExt::save_to", reason = "media-manager never writes embedded tags" },
]

# Trivially small enum variants are fine in this domain.
enum-variant-size-threshold = 0
